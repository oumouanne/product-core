# ============================================
# Configuration de TEST uniquement
# Utilise H2 (base en mémoire) à la place de MySQL
# Pas besoin d'un serveur MySQL pour les tests
# ============================================

# Base de données H2 en mémoire (créée au démarrage, supprimée à la fin)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialecte H2 pour Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# create-drop = crée les tables au démarrage, les supprime à la fin du test
spring.jpa.hibernate.ddl-auto=create-drop

# Désactiver Loki pendant les tests (pas de VM2 disponible)
spring.application.name=product-api-test