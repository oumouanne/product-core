# ============================================
# Pipeline GitLab CI/CD - Product API
# Déclenché à chaque push sur la branche develop
# 3 jobs : test → build → docker
# ============================================

# Définition des 3 étapes du pipeline dans l'ordre
stages:
  - test    # Étape 1 : exécuter les tests unitaires
  - build   # Étape 2 : compiler et créer le JAR
  - docker  # Étape 3 : builder et pousser l'image Docker

# Variables globales Maven
variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

# ============================================
# JOB 1 : test
# Exécute les tests unitaires avec Maven
# ============================================
test:
  stage: test
  # Image Maven avec Java 17
  image: maven:3.9.6-eclipse-temurin-17
  script:
    # Lance les tests unitaires
    - mvn test
  # Déclenché uniquement sur la branche develop
  only:
    - develop

# ============================================
# JOB 2 : build
# Compile le projet et génère le JAR
# ============================================
build:
  stage: build
  image: maven:3.9.6-eclipse-temurin-17
  script:
    # Compile et package sans relancer les tests
    - mvn clean package -DskipTests
  # Conserve le JAR généré pour le job suivant
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 hour
  only:
    - develop

# ============================================
# JOB 3 : docker
# Build l'image Docker et la pousse sur Docker Hub
# Utilise les variables GitLab :
#   - DOCKER_USERNAME : username Docker Hub
#   - DOCKER_PASSWORD : mot de passe Docker Hub
#   - DOCKER_IMAGE    : nom de l'image (oumouanne/product-api)
# ============================================
docker:
  stage: docker
  image: docker:24.0
  # Service Docker-in-Docker nécessaire pour builder des images
  services:
    - docker:24.0-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    # Connexion à Docker Hub
    - docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
    # Build de l'image Docker
    - docker build -t $DOCKER_IMAGE:latest .
    # Push de l'image sur Docker Hub
    - docker push $DOCKER_IMAGE:latest
  only:
    - develop


