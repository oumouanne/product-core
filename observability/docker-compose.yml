# ============================================
# Docker Compose - VM2 Monitoring
# Lance 3 conteneurs :
#   - Prometheus : collecte les métriques
#   - Grafana    : visualise les métriques
#   - Loki       : centralise les logs
# ============================================
version: '3.8'

services:

  # ==========================================
  # Prometheus : scrape /actuator/prometheus
  # Accessible sur http://<IP-VM2>:9090
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      # Monte le fichier de config prometheus.yml
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always

  # ==========================================
  # Grafana : dashboards métriques et logs
  # Accessible sur http://<IP-VM2>:3000
  # Login : admin / admin
  # ==========================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      # Mot de passe admin par défaut
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
      - loki
    restart: always

  # ==========================================
  # Loki : centralisation des logs
  # Accessible sur http://<IP-VM2>:3100
  # Les logs Spring Boot sont envoyés ici
  # ==========================================
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    restart: always


